<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="glass-app://sdk/glass-app.css">
<style>
  body { padding: 14px 16px; overflow: auto; }
  .note { color: var(--warn); margin-bottom: 10px; }
  .bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .bar button { padding: 2px 10px; border-radius: 6px; background: rgba(255,255,255,.08); color: var(--ink-dim); }
  .bar button.on { background: rgba(127,200,255,.2); color: var(--ink); }
  .row { display: grid; grid-template-columns: 110px 1fr 32px; align-items: center; gap: 10px; margin: 5px 0; font-family: var(--mono); }
  .fill { height: 10px; border-radius: 5px; background: var(--sky); }
  .n { text-align: right; color: var(--ink-dim); }
</style>
</head>
<body>
  <div class="note" id="note"></div>
  <div class="bar"><button data-by="count">By count</button><button data-by="name">By name</button></div>
  <div id="rows"></div>
  <script src="glass-app://sdk/glass-app.js"></script>
  <script>
    document.querySelectorAll('.bar button').forEach((b) => b.onclick = () => glass.run('sort', { by: b.dataset.by }));
    glass.onState(({ state }) => {
      document.getElementById('note').textContent = state.note;
      document.querySelectorAll('.bar button').forEach((b) => b.classList.toggle('on', b.dataset.by === state.sort));
      const entries = Object.entries(state.counts).sort(state.sort === 'name' ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => b[1] - a[1]);
      const max = Math.max(1, ...entries.map((e) => e[1]));
      document.getElementById('rows').innerHTML = entries.map(([tool, n]) =>
        `<div class="row"><span>${tool}</span><div class="fill" style="width:${(n / max) * 100}%"></div><span class="n">${n}</span></div>`).join('') || '<div class="n" style="text-align:left">No tool calls yet</div>';
    });
  </script>
</body>
</html>
